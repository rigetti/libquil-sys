name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: Bump versions and trigger a new release.
        required: true
        # `options` only takes effect on a choice input; without this the list was
        # inert and the field was a free-text string.
        type: choice
        default: release
        options:
          - release
          # Cuts an -rc version and marks the GitHub release as a prerelease, which
          # still publishes to crates.io. Use it to make a build testable before
          # committing to a stable version -- notably when libquil's ABI has changed
          # and both sides need releasing together.
          - prerelease

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.PAT }}
    - name: Install Knope
      uses: knope-dev/action@v2.1.0
      with:
        version: 0.10.0 # Test before updating, breaking changes likely: https://github.com/knope-dev/action#install-latest-version
    - run: |
        git config --global user.name "${{ github.triggering_actor }}"
        git config --global user.email "${{ github.triggering_actor}}@users.noreply.github.com"
    - name: Prepare Release
      run: knope ${{ inputs.type }} --verbose
      if: github.event_name == 'workflow_dispatch'

